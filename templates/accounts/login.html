{% extends 'landing_base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="page-hero">
    <div class="page-hero-content">
        <span class="page-hero-badge">Account</span>
        <h1>Welcome back</h1>
        <p>Sign in to manage applications, reviews, and grant activity.</p>
    </div>
</div>

<section class="auth-page">
    <div class="auth-card">
        <h1>Login</h1>
        <p class="auth-lead">Use your GrantIQ email and password to continue.</p>
        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %}
            <div class="auth-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="username">
            </div>
            <div class="auth-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="auth-submit">Login</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
    </div>
</section>
{% endblock %}
