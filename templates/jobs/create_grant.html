{% extends 'base.html' %}
{% block title %} Create Grant {% endblock %}
{% load humanize %}
{% load static %}
{% block content %}

<section class="py-5">
    <div class="container">
      <div class="row text-center">
        <div class="col-md-12">
          <h1 class="display-4 py-5 text-dark">Create Grant</h1>
          <p class="lead">Fill in the details below to create a new grant.</p>
        </div>
      </div>
    </div>
  </section>

<section id="create-grant" class="bg-light py-5">
  <div class="container">
    <div class="row">
      <div class="col-md-8 mx-auto">
        <div class="card py-4">
          <div class="card-header bg-dark text-white">
            <h4><i class="fa fa-plus"></i> Add New Grant</h4>
          </div>

          <div class="card-body">
            <!-- Alerts -->
            {% include 'partials/_alerts.html' %}

            <form action="{% url 'create_grant' %}" method="POST" enctype="multipart/form-data">
              {% csrf_token %}

              <div class="form-group">
                <label for="company">Company</label>
                <input type="text" name="company" class="form-control" required autocomplete="off">
              </div>

              <div class="form-group">
                <label for="title">Title</label>
                <input type="text" name="title" class="form-control" required autocomplete="off">
              </div>

              <div class="form-group">
                <label for="role">Role</label>
                <input type="text" name="role" class="form-control" required autocomplete="off">
              </div>

              <div class="form-group">
                <label for="location">Location</label>
                <select name="location" class="form-control" required>
                  <option value="" selected disabled>Select Location</option>
                  <option value="Nairobi">Nairobi</option>
                  <option value="Mombasa">Mombasa</option>
                  <option value="Kisumu">Kisumu</option>
                  <option value="Nakuru">Nakuru</option>
                  <option value="Eldoret">Eldoret</option>
                  <option value="Kakamega">Kakamega</option>
                  <option value="Nyeri">Nyeri</option>
                  <option value="Remote">Remote</option>
                </select>
              </div>

              <div class="form-group">
                <label for="contract">Eligibility Type</label>
                <select name="contract" class="form-control" required>
                  <option value="" selected disabled>Select Eligibility</option>
                  <option value="Part Time">Part Time</option>
                  <option value="Full Time">Full Time</option>
                  <option value="Freelance">Freelancer</option>
                </select>
              </div>

              <div class="form-group">
                <label for="vacancy">No. of projects to be supported</label>
                <input type="text" name="vacancy" class="form-control" required autocomplete="off">
              </div>

              <div class="form-group">
                <label for="experience">Duration in months</label>
                <input type="text" name="experience" class="form-control" required autocomplete="off">
              </div>

              <div class="form-group">
                <label for="salary">Funds available per project</label>
                <input type="number" name="salary" class="form-control" required autocomplete="off">
              </div>

              <div class="form-group">
                <label for="deadline">Deadline</label>
                <input type="datetime-local" name="deadline" class="form-control" required>
              </div>

              <div class="form-group">
                <label for="description">Description of the grant</label>
                <textarea name="description" rows="4" class="form-control" required></textarea>
              </div>

              <div class="form-group">
                <label for="about">About the Funding organization</label>
                <textarea name="about" rows="4" class="form-control" required></textarea>
              </div>

              <div class="form-group">
                <label for="main_image">Main Image</label>
                <input type="file" name="main_image" class="form-control-file" required>
              </div>

              <input type="submit" value="Create Grant" class="btn btn-primary btn-block mt-3">
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
