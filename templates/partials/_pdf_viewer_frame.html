{% load static %}
<div class="grant-pdf-viewer" data-pdf-url="{{ pdf_url }}" data-pdf-worker="{% static 'js/pdf.worker.min.js' %}">
    <div class="grant-pdf-controls">
        <button type="button" class="pdf-prev" title="Previous page" aria-label="Previous page">
            <i class="fa fa-chevron-up fas fa-chevron-up"></i>
        </button>
        <label class="pdf-page-label">
            <input type="number" class="pdf-page-num" min="1" value="1">
            of <span class="pdf-page-count">–</span>
        </label>
        <button type="button" class="pdf-next" title="Next page" aria-label="Next page">
            <i class="fa fa-chevron-down fas fa-chevron-down"></i>
        </button>
        <button type="button" class="pdf-zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <span class="pdf-zoom-label">100%</span>
        <button type="button" class="pdf-zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
    </div>
    <p class="grant-pdf-status">Loading document…</p>
    <div class="grant-pdf-pages"></div>
</div>
